<circle cx="88" cy="47" r="7" fill="#27c93f"/>
<text x="450" y="52" font-size="13" fill="#8b949e" text-anchor="middle">zyrox@termux: ~/zyrox-encryption</text>

<g font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">
  <text x="44" y="110" font-size="16" fill="#7ee787">$</text>
  <text x="63.2" y="110" font-size="16" fill="#e6edf3"
