<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img">
<title>ZYROX ENCRYPTION logo</title>
<defs>
  <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff7a00"/><stop offset="1" stop-color="#ffb300"/>
  </linearGradient>
  <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#141a21"/><stop offset="1" stop-color="#0b0f14"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<path d="M100 12 L172 42 V104 C172 152 140 186 100 206 C60 186 28 152 28 104 V42 Z"
      fill="url(#inner)" stroke="url(#shield)" stroke-width="5" filter="url(#soft)"/>
<path d="M100 26 L160 50 V104 C160 144 134 173 100 191 C66 173 40 144 40 104 V50 Z"
      fill="none" stroke="#ff7a00" stroke-opacity="0.35" stroke-width="1.5"/>

<!-- Z -->
<path d="M62 62 H138 V78 L96 112 H138 V130 H62 V114 L104 80 H62 Z" fill="url(#shield)"/>
<!-- circuit dots -->
<circle cx="150" cy="86" r="3.4" fill="#ffb300"/><circle cx="150" cy="112" r="3.4" fill="#ffb300"/>
<circle cx="50" cy="86" r="3.4" fill="#ffb300"/><circle cx="50" cy="112" r="3.4" fill="#ffb300"/>

<!-- padlock -->
<path d="M89 158 v-8 a11 11 0 0 1 22 0 v8" fill="none" stroke="#ffb300" stroke-width="3.6" stroke-linecap="round"/>
<rect x="82" y="157" width="36" height="27" rx="6" fill="none" stroke="url(#shield)" stroke-width="3.6"/>
<circle cx="100" cy="169" r="3.6" fill="#ffb300"/><path d="M100 171.5 v6" stroke="#ffb300" stroke-width="3.4" stroke-linecap="round"/>
</svg>
